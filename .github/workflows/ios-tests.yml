# This workflow will build a Java project with Maven and cache/restore any dependencies to improve the workflow execution time
# For more information, see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that GitHub does not certify.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Appium iOS Tests

on:
  push:
  workflow_dispatch:

jobs:
  ios-tests:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      SIM_DEVICE: "iPhone 15"
      PLATFORM: ios
      IOS_PLATFORM_VERSION: "17.5"
      CI_SINGLE_SESSION: "true"
      LOGIN_VALID_USER: ${{ secrets.LOGIN_VALID_USER }}
      LOGIN_VALID_PASSWORD: ${{ secrets.LOGIN_VALID_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Boot iOS Simulator
        run: xcrun simctl boot "${SIM_DEVICE}" 2>/dev/null || true

      - name: Runner Diagnostics
        run: |
          uname -a
          sw_vers

      - name: Align iOS Config For CI
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("src/test/resources/config/ios.json")
          raw = path.read_text()
          raw = "\n".join(
              line for line in raw.splitlines()
              if not line.lstrip().startswith("//")
          )
          data = json.loads(raw)
          data["deviceName"] = "${{ env.SIM_DEVICE }}"
          data["platformVersion"] = "${{ env.IOS_PLATFORM_VERSION }}"
          data["derivedDataPath"] = "/tmp/wda-deriveddata"
          data["noReset"] = True
          path.write_text(json.dumps(data, indent=4) + "\n")
          print("Updated ios.json:", data)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Appium & XCUITest Driver
        id: cache-appium
        uses: actions/cache@v4
        with:
          path: ~/.npm-global
          key: appium-xcuitest-${{ runner.os }}-${{ hashFiles('.github/workflows/ios-tests.yml') }}

      - name: Cache WebDriverAgent Build
        uses: actions/cache@v4
        with:
          path: /tmp/wda-deriveddata
          key: wda-${{ runner.os }}-${{ env.IOS_PLATFORM_VERSION }}-${{ hashFiles('.github/workflows/ios-tests.yml') }}

      - name: Add Appium to PATH
        run: |
          npm config set prefix ~/.npm-global
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH

      - name: Install Appium
        if: steps.cache-appium.outputs.cache-hit != 'true'
        run: |
          npm install -g appium
          ~/.npm-global/bin/appium driver install xcuitest

      - name: Wait for iOS Simulator
        run: xcrun simctl bootstatus "${SIM_DEVICE}" -b

      - name: Pre-install App on Simulator
        run: |
          unzip -q -o apps/ios/TheApp.app.zip -d /tmp/app-unzip
          xcrun simctl install booted /tmp/app-unzip/TheApp.app

      - name: Start Appium Server
        run: |
          appium --log-level warn --port 4723 > appium.log 2>&1 &
          sleep 5

      - name: Run iOS Tests
        run: mvn -Pcucumber test -Dplatform=${PLATFORM} -Dcucumber.filter.tags=@login

      - name: Upload Appium Log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appium-ios-log
          path: appium.log
